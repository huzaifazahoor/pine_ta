[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pine_ta"
version = "0.2.0"
description = "Pure pandas/numpy technical indicators that match Pine Script"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Huzaifa Zahoor", email = "huzaifazahoor654@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["pandas>=1.5", "numpy>=1.23"]
keywords = ["pine script", "tradingview", "technical analysis", "indicators", "pandas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/huzaifazahoor/pine_ta"
Issues = "https://github.com/huzaifazahoor/pine_ta/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["pine_ta*"]